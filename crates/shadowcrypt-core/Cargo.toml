[package]
name = "shadowcrypt-core"
description = "File encryption core for ShadowCrypt: SCR3 format plus legacy SCR2 and AES Crypt (v0-v3) decryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
ctr = "0.9"
ghash = "0.5"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
scrypt = { version = "0.11", default-features = false }
subtle = "2.6"
zeroize = "1.8"
getrandom = "0.2"
tempfile = "3"
fs4 = "1"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
